<script>
// ── Config ────────────────────────────────────────────────────────────────
const API_BASE = "https://cryptovol-api-nbakzshi6q-uc.a.run.app";
const POST_URL = API_BASE + "/v1/chat/";

// localStorage keys are scoped to the currently signed-in Clerk user so that
// switching accounts in the same browser doesn't bleed chat history across
// users. ``storageKey`` / ``conversationKey`` get populated after Clerk.load()
// resolves the current user — see the boot block below.
const STORAGE_KEY_BASE      = "cryptovol-chat-v1";
const CONVERSATION_KEY_BASE = "cryptovol-chat-conv-id";
let storageKey      = STORAGE_KEY_BASE;
let conversationKey = CONVERSATION_KEY_BASE;

// `history` is the API-shape array sent in each request ({role, content}).
// `messages` is the full transcript including chart specs, used for re-rendering on reload.
let history  = [];
let messages = [];
// Populated after Clerk loads and we know which user's cache to read.
let conversationId = null;

function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({ history, messages }));
  } catch (e) {
    console.warn("persist failed:", e);   // quota exceeded; ignore
  }
}

function restore() {
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.messages)) return false;
    history  = Array.isArray(data.history) ? data.history : [];
    messages = data.messages;
    return true;
  } catch (e) {
    console.warn("restore failed:", e);
    return false;
  }
}

async function clearHistory() {
  if (!confirm("Clear chat history? This will hide your previous conversations.")) return;
  // Clear server-side (soft delete) — data stays in our DB for analytics but
  // won't reappear on this or any other device the user logs into.
  try {
    const token = await window.Clerk.session.getToken();
    await fetch(API_BASE + "/v1/chat/clear", {
      method: "POST",
      headers: { "Authorization": `Bearer ${token}` },
    });
  } catch (e) {
    console.warn("server clear failed:", e);
  }
  history = [];
  messages = [];
  conversationId = null;
  localStorage.removeItem(storageKey);
  localStorage.removeItem(conversationKey);
  document.getElementById("chat").innerHTML = "";
  renderGreeting();
}

async function fetchServerHistory() {
  // Pull stored history from the API so it follows the user across devices.
  // Falls back to localStorage if the request fails (network, transient 5xx).
  try {
    const token = await window.Clerk.session.getToken();
    const r = await fetch(API_BASE + "/v1/chat/history", {
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const rows = Array.isArray(data.messages) ? data.messages : [];
    if (!rows.length) return false;

    history = [];
    messages = [];
    let lastConversationId = null;
    for (const m of rows) {
      const role = m.role === "assistant" ? "bot" : "user";
      if (m.conversation_id) lastConversationId = m.conversation_id;
      // Build the API-shape history array (used in subsequent /v1/chat calls).
      history.push({ role: m.role === "assistant" ? "assistant" : "user", content: m.text });
      // Build the render-shape messages array (used by replayMessages).
      messages.push({
        role, text: m.text,
        id:         m.id || null,
        feedback:   m.feedback || null,
        chart_spec: m.chart_spec || null,
        table:      m.table      || null,
        api_calls:  m.api_calls  || null,
        meta:       null,
      });
    }
    // Continue the most recent conversation thread by default.
    if (lastConversationId) {
      conversationId = lastConversationId;
      localStorage.setItem(conversationKey, conversationId);
    }
    persist();
    return true;
  } catch (e) {
    console.warn("fetchServerHistory failed:", e);
    return false;
  }
}

function renderGreeting() {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = `<pre>Ask me to plot a vol smile, risk reversal, term structure, IV history, RV, spot, open-interest flow, or any overlay.</pre>
    <div class="examples">
      Try:
      <a onclick="setQ(this)">Plot BTC 1M smile for last Friday vs today</a>
      <a onclick="setQ(this)">Show ETH 25Δ risk reversal last 3 months</a>
      <a onclick="setQ(this)">Compare BTC IV vs realized vol</a>
      <a onclick="setQ(this)">Show ETH ΔOI by strike for the Jun 26 expiry</a>
    </div>`;
  chat.appendChild(div);
}

function replayMessages() {
  for (const m of messages) {
    addMsg(m.role, m.text, m.meta);
    if (m.chart_spec) addChart(m.chart_spec);
    if (m.table)      addTable(m.table);
    if (m.api_calls)  addApiCalls(m.api_calls);
    if (m.role === "bot" && m.id) addFeedback(m.id, m.feedback || null);
  }
}

// Append 👍 / 👎 buttons for an assistant message in their own subtle row.
function addFeedback(messageId, current) {
  const chat = document.getElementById("chat");

  const fb = document.createElement("div");
  fb.className = "feedback";
  fb.dataset.messageId = String(messageId);
  fb.innerHTML = `
    <button data-value="up"   class="up${current === "up"   ? " selected" : ""}">👍</button>
    <button data-value="down" class="down${current === "down" ? " selected" : ""}">👎</button>
  `;
  fb.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", async () => {
      const wasSelected = b.classList.contains("selected");
      const newValue = wasSelected ? "clear" : b.dataset.value;
      try {
        const token = await window.Clerk.session.getToken();
        const r = await fetch(`${API_BASE}/v1/chat/messages/${messageId}/feedback`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ value: newValue }),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        fb.querySelectorAll("button").forEach(x => x.classList.remove("selected"));
        if (newValue !== "clear") b.classList.add("selected");
      } catch (e) {
        console.warn("feedback failed:", e);
      }
    });
  });

  const row = document.createElement("div");
  row.className = "msg bot feedback-row";
  row.appendChild(fb);
  chat.appendChild(row);
  window.scrollTo(0, document.body.scrollHeight);
}

// ── Boot: wait for Clerk, gate on signed-in, then render UI ───────────────
window.addEventListener("load", async () => {
  await window.Clerk.load();

  if (!window.Clerk.user) {
    // Not signed in → send to login, return here after.
    window.location.href = "/login";
    return;
  }

  // Swap Log in for UserButton in the nav slot.
  document.getElementById("nav-login-link").style.display = "none";
  const navSlot = document.getElementById("nav-user-slot");
  navSlot.style.display = "inline-flex";
  window.Clerk.mountUserButton(navSlot, {
    afterSignOutUrl: "/login",
    userProfileMode: "navigation",
    userProfileUrl: "/account",
  });

  // Scope localStorage to the signed-in user so switching accounts in the
  // same browser doesn't leak history (or conversation_id) across users.
  // Also evict any unscoped legacy entries so the leak window closes cleanly.
  const uid = window.Clerk.user.id;
  storageKey      = `${STORAGE_KEY_BASE}:${uid}`;
  conversationKey = `${CONVERSATION_KEY_BASE}:${uid}`;
  localStorage.removeItem(STORAGE_KEY_BASE);       // legacy, unscoped
  localStorage.removeItem(CONVERSATION_KEY_BASE);  // legacy, unscoped
  conversationId = localStorage.getItem(conversationKey);

  document.getElementById("app").innerHTML = `
    <div class="toolbar">
      <button class="link" onclick="clearHistory()">Clear history</button>
    </div>
    <div id="chat" class="chat"></div>
    <div class="input-row">
      <input type="text" id="input" placeholder="Ask about vol analytics..." autofocus
             onkeydown="if(event.key==='Enter') send()">
      <button id="send" onclick="send()">Send</button>
    </div>`;

  // Server is the authority. If it returns rows, replay. If it returns nothing,
  // show the greeting — do NOT fall back to localStorage. That fallback would
  // leak history across accounts when the new user happens to have no rows on
  // the server but the previous user's cache is still in this browser.
  const serverHit = await fetchServerHistory();
  if (serverHit) {
    replayMessages();
  } else {
    // No server-side history — wipe any per-user cache (could be from a previous
    // session that the user has since cleared on another device) and greet.
    localStorage.removeItem(storageKey);
    history = [];
    messages = [];
    renderGreeting();
  }
  document.getElementById("input").focus();
});

function setQ(el) {
  document.getElementById("input").value = el.textContent.trim();
  document.getElementById("input").focus();
}

function addMsg(role, html, _meta) {
  // _meta (tool/token/cost diagnostic) is intentionally not rendered to users.
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = "<pre>" + html + "</pre>";
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

// ── Lightweight Charts renderer ───────────────────────────────────────────────
const _CV_PALETTE = ["#4F7BE8","#E8A030","#16a34a","#dc2626","#7c3aed","#0891b2"];
const _LWC_DASH   = { solid: 0, dash: 1, dot: 3, dashdot: 4 };

function addChart(spec) {
  const chat = document.getElementById("chat");
  const wrapper = document.createElement("div");
  wrapper.className = "chart";

  // Title
  const rawTitle = typeof spec.layout?.title === "string"
    ? spec.layout.title : (spec.layout?.title?.text || "");

  // Header row: serif title + download icon
  const header = document.createElement("div");
  header.className = "chart-header";
  const titleEl = document.createElement("span");
  titleEl.className = "chart-title";
  titleEl.textContent = rawTitle;
  const dlBtn = document.createElement("button");
  dlBtn.className = "chart-dl";
  dlBtn.title = "Download PNG";
  dlBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
  header.appendChild(titleEl);
  header.appendChild(dlBtn);

  const traces    = spec.data || [];
  const hasY2     = traces.some(t => t.yaxis === "y2");

  // Extract axis titles from Plotly spec (backend normalises to {text:...} objects)
  const axTitle = (ax) => ax?.title?.text || (typeof ax?.title === "string" ? ax.title : "");
  const yTitle  = axTitle(spec.layout?.yaxis);
  const y2Title = axTitle(spec.layout?.yaxis2);
  const xTitle  = axTitle(spec.layout?.xaxis);

  // Grid: [y2-label | canvas | y1-label]
  const axesWrap = document.createElement("div");
  axesWrap.className = "chart-axes-wrap" + (hasY2 ? " has-y2" : "");

  const lblY2 = document.createElement("div");
  lblY2.className = "chart-axis-label y-side";
  lblY2.textContent = y2Title;

  const chartEl = document.createElement("div");
  chartEl.className = "chart-canvas";

  const lblY1 = document.createElement("div");
  lblY1.className = "chart-axis-label y-side";
  lblY1.textContent = yTitle;

  axesWrap.appendChild(lblY2);
  axesWrap.appendChild(chartEl);
  axesWrap.appendChild(lblY1);

  wrapper.appendChild(header);
  wrapper.appendChild(axesWrap);
  if (xTitle) {
    const lblX = document.createElement("div");
    lblX.className = "chart-xlabel";
    lblX.textContent = xTitle;
    wrapper.appendChild(lblX);
  }
  chat.appendChild(wrapper);
  const firstX    = traces[0]?.x?.[0];
  const isTime    = firstX != null && /^\d{4}-\d{2}-\d{2}/.test(String(firstX));
  const barmode   = spec.layout?.barmode;
  const barTraces = traces.filter(t => t.type === "bar");
  const nBars     = barTraces.length;
  // x labels for category axes (strikes, tenors, etc.)
  const xCats = isTime ? null : (traces[0]?.x || []);
  const fmtCat = (v) => {
    const n = Number(v);
    if (isNaN(n)) return String(v);
    return n >= 1000 ? (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + "k" : String(n);
  };

  const _DPR = window.devicePixelRatio || 1;
  const chart = LightweightCharts.createChart(chartEl, {
    width:  chartEl.offsetWidth || 860,
    height: chartEl.offsetHeight || 360,
    devicePixelRatio: _DPR,
    layout: {
      background: { type: "solid", color: "transparent" },
      textColor:  "#64748b",
      fontFamily: '"IBM Plex Mono", Menlo, monospace',
      fontSize:   11,
    },
    grid: {
      vertLines: { color: "rgba(15,23,42,0.05)" },
      horzLines: { color: "rgba(15,23,42,0.05)" },
    },
    crosshair: {
      vertLine: { color: "rgba(31,111,191,0.35)", labelBackgroundColor: "#1F6FBF" },
      horzLine: { color: "rgba(31,111,191,0.35)", labelBackgroundColor: "#1F6FBF" },
    },
    timeScale: { borderColor: "rgba(15,23,42,0.10)", timeVisible: true, secondsVisible: false },
    rightPriceScale: { borderColor: "rgba(15,23,42,0.10)" },
    leftPriceScale:  { borderColor: "rgba(15,23,42,0.10)", visible: hasY2 },
  });

  // Collect series refs so the legend can toggle/isolate them
  const seriesRefs = [];

  traces.forEach((trace, idx) => {
    const isY2   = trace.yaxis === "y2";
    const scaleId = isY2 ? "left" : "right";
    const rawC   = trace.line?.color;
    const color  = typeof rawC === "string" ? rawC
      : typeof trace.marker?.color === "string" ? trace.marker.color
      : _CV_PALETTE[idx % _CV_PALETTE.length];
    const lineStyle = _LWC_DASH[trace.line?.dash] ?? 0;

    if (trace.type === "bar") {
      // Grouped bars: interleave time slots so call/put bars sit side-by-side.
      // Group i occupies slots [i*(nBars+1)+1 … i*(nBars+1)+nBars]; gap follows.
      const barIdx  = barTraces.indexOf(trace);
      const groupStep = nBars > 1 ? nBars + 1 : 1;
      const perBarColors = Array.isArray(trace.marker?.color) ? trace.marker.color : null;
      const s = chart.addHistogramSeries({
        color, base: 0, priceScaleId: scaleId,
        priceFormat: { type: "volume" },
        lastValueVisible: false, priceLineVisible: false,
      });
      s.setData((trace.x || []).map((x, i) => ({
        time:  isTime ? x.slice(0, 10) : (i * groupStep + barIdx + 1),
        value: trace.y[i] ?? 0,
        color: perBarColors ? perBarColors[i] : color,
      })).filter(d => d.value != null));
      seriesRefs.push({ series: s, color });

    } else {
      // scatter → area (if fill set) or line
      const isArea = trace.fill === "tozeroy" || trace.fill === "tonexty";
      const s = isArea
        ? chart.addAreaSeries({
            lineColor: color, topColor: color + "35", bottomColor: color + "00",
            lineWidth: 2, priceScaleId: scaleId, lineStyle,
            lastValueVisible: false, priceLineVisible: false,
          })
        : chart.addLineSeries({
            color, lineWidth: 2, priceScaleId: scaleId, lineStyle,
            lastValueVisible: false, priceLineVisible: false,
          });
      s.setData((trace.x || []).map((x, i) => ({
        time:  isTime ? x.slice(0, 10) : i + 1,
        value: trace.y[i],
      })).filter(d => d.value != null && !isNaN(d.value)));
      seriesRefs.push({ series: s, color });
    }
  });

  // Category x-axis: override tick labels with the actual category values
  if (!isTime && xCats.length) {
    const groupStep = nBars > 1 ? nBars + 1 : 1;
    chart.timeScale().applyOptions({
      tickMarkFormatter: (t) => {
        if (nBars > 1 && barmode === "group") {
          // Show label only under the first bar of each group
          if ((t - 1) % groupStep !== 0) return "";
          const gi = Math.floor((t - 1) / groupStep);
          return xCats[gi] != null ? fmtCat(xCats[gi]) : "";
        }
        const i = t - 1;
        return xCats[i] != null ? fmtCat(xCats[i]) : "";
      },
    });
  }

  chart.timeScale().fitContent();

  // Watermark overlay — sits above the canvas, pointer-events:none so chart stays interactive
  const watermark = document.createElement("div");
  watermark.className = "chart-watermark";
  watermark.textContent = "Generated by Quanta AI · cryptovol.io";
  chartEl.appendChild(watermark);

  // Legend — click to toggle, double-click to isolate (same as Plotly behaviour)
  if (traces.length > 1) {
    const legend = document.createElement("div");
    legend.className = "chart-legend";
    const hidden = new Set();         // indices of hidden series
    const items = [];

    const applyVisibility = () => {
      seriesRefs.forEach(({ series }, i) => {
        series.applyOptions({ visible: !hidden.has(i) });
      });
      items.forEach((el, i) => {
        el.style.opacity = hidden.has(i) ? "0.35" : "1";
      });
    };

    traces.forEach((trace, idx) => {
      const { color: c } = seriesRefs[idx];
      const item = document.createElement("span");
      item.className = "chart-legend-item";
      item.style.cursor = "pointer";
      item.innerHTML = `<span class="chart-legend-swatch" style="background:${c}"></span>${trace.name || ""}`;
      items.push(item);

      let clickTimer = null;
      item.addEventListener("click", () => {
        // Debounce: wait 220 ms to distinguish single vs double click
        if (clickTimer) return;
        clickTimer = setTimeout(() => {
          clickTimer = null;
          // Toggle this series
          hidden.has(idx) ? hidden.delete(idx) : hidden.add(idx);
          applyVisibility();
        }, 220);
      });
      item.addEventListener("dblclick", () => {
        // Cancel the pending single-click
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
        // Isolate: if already isolated, restore all; else hide everything else
        const isIsolated = hidden.size === traces.length - 1 && !hidden.has(idx);
        hidden.clear();
        if (!isIsolated) traces.forEach((_, i) => { if (i !== idx) hidden.add(i); });
        applyVisibility();
      });

      legend.appendChild(item);
    });
    wrapper.appendChild(legend);
  }

  // Download: Retina-quality PNG — title + chart + axis labels + legend + watermark
  dlBtn.addEventListener("click", () => {
    const canvas = chartEl.querySelector("canvas");
    if (!canvas) return;
    const dpr = _DPR;
    const logW = Math.round(canvas.width  / dpr);
    const logH = Math.round(canvas.height / dpr);
    const hasLegend = traces.length > 1;
    const TITLE_H  = rawTitle ? 40 : 0;
    const LEGEND_H = hasLegend ? 34 : 0;
    // Give each axis label its own 22px column outside the chart area
    const LW = yTitle  ? 22 : 0;   // left margin  (y2 label)
    const RW = y2Title ? 22 : 0;   // right margin (y2 label when y2 present)
    // In LWC our mapping: isY2→left scale, primary→right scale
    // On screen: left column = y2Title, right column = yTitle (primary)
    const LEFT_W  = y2Title ? 22 : 0;
    const RIGHT_W = yTitle  ? 22 : 0;
    const totalW  = LEFT_W + logW + RIGHT_W;
    const totalH  = TITLE_H + logH + LEGEND_H;
    const cx = LEFT_W;   // x-offset where chart starts

    const off = document.createElement("canvas");
    off.width  = totalW * dpr;
    off.height = totalH * dpr;
    const ctx = off.getContext("2d");
    ctx.scale(dpr, dpr);

    // White background
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, totalW, totalH);

    // Title
    if (rawTitle) {
      ctx.font = `500 14px Georgia, "Times New Roman", serif`;
      ctx.fillStyle = "#0f172a";
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(rawTitle, cx + 4, TITLE_H / 2);
    }

    // LWC chart canvas
    ctx.drawImage(canvas, cx, TITLE_H, logW, logH);

    // Y-axis labels in their dedicated columns, cleanly outside the chart
    const axFont = `400 10px system-ui, -apple-system, sans-serif`;
    const chartMidY = TITLE_H + logH / 2;
    ctx.font = axFont; ctx.fillStyle = "#94a3b8";
    if (yTitle) {   // primary → right column
      ctx.save();
      ctx.translate(cx + logW + RIGHT_W / 2, chartMidY);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(yTitle, 0, 0);
      ctx.restore();
    }
    if (y2Title) {  // secondary → left column
      ctx.save();
      ctx.translate(LEFT_W / 2, chartMidY);
      ctx.rotate(Math.PI / 2);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(y2Title, 0, 0);
      ctx.restore();
    }

    // X-axis label
    if (xTitle) {
      ctx.font = axFont; ctx.fillStyle = "#94a3b8";
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(xTitle, cx + logW / 2, TITLE_H + logH + 4);
    }

    // Legend row
    if (hasLegend) {
      const ly = TITLE_H + logH + (xTitle ? 20 : LEGEND_H / 2);
      ctx.font = `400 11px system-ui, -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.textBaseline = "middle";
      let x = cx + 8;
      traces.forEach((trace, idx) => {
        const { color } = seriesRefs[idx];
        ctx.strokeStyle = color; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(x, ly); ctx.lineTo(x + 18, ly); ctx.stroke();
        x += 24;
        ctx.fillStyle = "#475569";
        const name = trace.name || "";
        ctx.fillText(name, x, ly);
        x += ctx.measureText(name).width + 18;
      });
    }

    // Watermark
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = "#0f172a";
    ctx.font = `500 11px "IBM Plex Mono", Menlo, monospace`;
    ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.fillText("Generated by Quanta AI · cryptovol.io", cx + logW - 12, TITLE_H + logH - 10);
    ctx.restore();

    const a = document.createElement("a");
    a.download = "cryptovol-chart.png";
    a.href = off.toDataURL("image/png");
    a.click();
  });

  // Keep chart sized to its container
  new ResizeObserver(() => {
    chart.resize(chartEl.offsetWidth, chartEl.offsetHeight);
  }).observe(chartEl);

  window.scrollTo(0, document.body.scrollHeight);
}

// Expandable grouped table: parent rows whose legs are nested under __legs__.
// Each parent shows a ▸ toggle; clicking expands its legs as a sub-table.
function addNestedTable(groups) {
  const chat = document.getElementById("chat");
  const isEmpty = (v) => v === null || v === undefined || v === "";
  const isNum   = (v) => !isEmpty(v) && !isNaN(Number(v));
  const esc = (v) => String(v).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const pcols = Object.keys(groups[0]).filter(k => k !== "__legs__");
  const lcols = (groups[0].__legs__ && groups[0].__legs__.length)
    ? Object.keys(groups[0].__legs__[0]) : [];

  const wrap = document.createElement("div");
  wrap.className = "msg bot";

  const bar = document.createElement("div");
  bar.className = "nt-bar";
  const toggleAll = document.createElement("button");
  toggleAll.className = "table-toggle";
  bar.appendChild(toggleAll);

  const table = document.createElement("table");
  table.className = "data-table nested-table";
  const thead = document.createElement("thead");
  const htr = document.createElement("tr");
  htr.appendChild(document.createElement("th"));          // toggle column (not sortable)
  pcols.forEach(c => {
    const th = document.createElement("th");
    th.textContent = c; th.className = "sortable";
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);
  const tbody = document.createElement("tbody");
  table.appendChild(tbody);

  const legTable = (g) =>
    "<table class='data-table leg-table'><thead><tr>" +
    lcols.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr></thead><tbody>" +
    (g.__legs__ || []).map(l => "<tr>" + lcols.map(c => "<td>" + (isEmpty(l[c]) ? "" : esc(l[c])) + "</td>").join("") + "</tr>").join("") +
    "</tbody></table>";

  // Rebuild rows from the current `groups` order, preserving each group's
  // expand state (g.__open). Sorting reorders `groups`; legs follow the parent.
  const renderBody = () => {
    tbody.innerHTML = "";
    groups.forEach(g => {
      const ptr = document.createElement("tr");
      ptr.className = "nt-parent";
      ptr.innerHTML = '<td class="nt-toggle">' + (g.__open ? "▾" : "▸") + "</td>" +
        pcols.map(c => "<td>" + (isEmpty(g[c]) ? "" : esc(g[c])) + "</td>").join("");
      const dtr = document.createElement("tr");
      dtr.className = "nt-detail";
      dtr.style.display = g.__open ? "" : "none";
      const td = document.createElement("td");
      td.colSpan = pcols.length + 1;
      td.innerHTML = legTable(g);
      dtr.appendChild(td);
      ptr.style.cursor = "pointer";
      ptr.addEventListener("click", () => {
        g.__open = !g.__open;
        dtr.style.display = g.__open ? "" : "none";
        ptr.querySelector(".nt-toggle").textContent = g.__open ? "▾" : "▸";
      });
      tbody.appendChild(ptr);
      tbody.appendChild(dtr);
    });
  };
  renderBody();

  // Sort parent groups by a column (click to flip asc/desc); legs travel along.
  htr.querySelectorAll("th.sortable").forEach((th, i) => {
    const col = pcols[i];
    th.addEventListener("click", () => {
      const dir = th.dataset.dir === "asc" ? "desc" : "asc";
      htr.querySelectorAll("th").forEach(o => { o.dataset.dir = ""; o.classList.remove("sort-asc", "sort-desc"); });
      th.dataset.dir = dir; th.classList.add(dir === "asc" ? "sort-asc" : "sort-desc");
      groups.sort((a, b) => {
        const va = a[col], vb = b[col];
        if (isEmpty(va) && isEmpty(vb)) return 0;
        if (isEmpty(va)) return 1;
        if (isEmpty(vb)) return -1;
        const cmp = (isNum(va) && isNum(vb))
          ? Number(va) - Number(vb)
          : String(va).localeCompare(String(vb), undefined, { numeric: true });
        return dir === "asc" ? cmp : -cmp;
      });
      renderBody();
    });
  });

  let allOpen = false;
  const setLbl = () => toggleAll.textContent = allOpen ? "Collapse all" : "Expand all";
  setLbl();
  toggleAll.addEventListener("click", () => {
    allOpen = !allOpen;
    groups.forEach(g => g.__open = allOpen);
    renderBody();
    setLbl();
  });

  wrap.appendChild(bar);
  const scroll = document.createElement("div");
  scroll.className = "table-scroll";
  scroll.appendChild(table);
  wrap.appendChild(scroll);
  chat.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
}

function addTable(rows) {
  if (!Array.isArray(rows) || !rows.length) return;
  if (rows[0] && rows[0].__legs__) { addNestedTable(rows); return; }
  const chat = document.getElementById("chat");
  const cols = Object.keys(rows[0]);
  const COLLAPSE_AT = 12;   // collapse tables longer than this

  const isEmpty = (v) => v === null || v === undefined || v === "";
  const isNum   = (v) => !isEmpty(v) && !isNaN(Number(v));
  const esc = (v) => String(v).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  const wrap  = document.createElement("div");
  wrap.className = "msg bot";

  const table = document.createElement("table");
  table.className = "data-table";

  const htr = document.createElement("tr");
  cols.forEach(c => {
    const th = document.createElement("th");
    th.textContent = c;
    th.className = "sortable";
    htr.appendChild(th);
  });
  const thead = document.createElement("thead");
  thead.appendChild(htr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  table.appendChild(tbody);
  const data = rows.slice();
  const renderBody = () => {
    tbody.innerHTML = data.map(r =>
      "<tr>" + cols.map(c => "<td>" + (isEmpty(r[c]) ? "" : esc(r[c])) + "</td>").join("") + "</tr>"
    ).join("");
  };
  renderBody();

  // Click a header to sort by that column; click again to flip direction.
  // Numeric columns compare numerically, text uses a natural-order compare;
  // blank cells always sink to the bottom regardless of direction.
  htr.querySelectorAll("th").forEach((th, ci) => {
    th.addEventListener("click", () => {
      const col = cols[ci];
      const dir = th.dataset.dir === "asc" ? "desc" : "asc";
      htr.querySelectorAll("th").forEach(o => {
        o.dataset.dir = ""; o.classList.remove("sort-asc", "sort-desc");
      });
      th.dataset.dir = dir;
      th.classList.add(dir === "asc" ? "sort-asc" : "sort-desc");
      data.sort((a, b) => {
        const va = a[col], vb = b[col];
        if (isEmpty(va) && isEmpty(vb)) return 0;
        if (isEmpty(va)) return 1;
        if (isEmpty(vb)) return -1;
        const cmp = (isNum(va) && isNum(vb))
          ? Number(va) - Number(vb)
          : String(va).localeCompare(String(vb), undefined, { numeric: true });
        return dir === "asc" ? cmp : -cmp;
      });
      renderBody();
    });
  });

  // Wrap in a horizontally scrollable container so wide tables don't overflow
  // the chat bubble (and stay swipeable on mobile).
  const scroll = document.createElement("div");
  scroll.className = "table-scroll";
  scroll.appendChild(table);

  if (rows.length > COLLAPSE_AT) {
    const box = document.createElement("div");
    box.className = "table-collapse collapsed";
    box.appendChild(scroll);
    const btn = document.createElement("button");
    btn.className = "table-toggle";
    const setLbl = () => btn.textContent =
      box.classList.contains("collapsed") ? `Show all ${rows.length} rows` : "Show less";
    setLbl();
    btn.addEventListener("click", () => { box.classList.toggle("collapsed"); setLbl(); });
    wrap.appendChild(box);
    wrap.appendChild(btn);
  } else {
    wrap.appendChild(scroll);
  }

  chat.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
}

function addApiCalls(calls) {
  if (!Array.isArray(calls) || !calls.length) return;
  const chat = document.getElementById("chat");
  const lines = calls.map(c => {
    const payload = JSON.stringify(c.payload, null, 2);
    return `${c.method} ${c.path}\n${payload}`;
  }).join("\n\n");
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.innerHTML = `<details class="api-calls">
    <summary>▸ API request${calls.length > 1 ? "s (" + calls.length + ")" : ""}</summary>
    <pre></pre>
  </details>`;
  wrap.querySelector("pre").textContent = lines;  // textContent escapes HTML
  chat.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
}

async function send() {
  const input = document.getElementById("input");
  const btn   = document.getElementById("send");
  const msg = input.value.trim();
  if (!msg) return;

  addMsg("user", msg);
  input.value = "";
  btn.disabled = true;

  const thinking = addMsg("bot", "thinking…");

  try {
    const token = await window.Clerk.session.getToken();
    const r = await fetch(POST_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({
        message: msg,
        history: history,
        conversation_id: conversationId,
      }),
    });

    if (!r.ok) {
      thinking.remove();
      // Try to parse a structured error (e.g., 429 quota) and present it nicely.
      let friendly = null;
      try {
        const body = await r.json();
        if (r.status === 429 && body.detail) {
          // The backend returns: "Quota exceeded: X/Y chat messages this day on the
          // BASIC plan. Upgrade to PRO for a larger quota. https://www.cryptovol.io/account"
          friendly = body.detail.replace(/\s*https:\/\/\S+/g, "").trim();
        } else if (body.detail) {
          friendly = body.detail;
        }
      } catch (_e) { /* non-JSON, fall through */ }

      if (r.status === 429 && friendly) {
        const wrap = document.createElement("div");
        wrap.className = "msg err";
        wrap.innerHTML = `<pre></pre>
          <div class="meta" style="margin-top:8px;">
            <a href="/account" style="color:var(--blue);">Upgrade or view usage on /account →</a>
          </div>`;
        wrap.querySelector("pre").textContent = friendly;
        document.getElementById("chat").appendChild(wrap);
        window.scrollTo(0, document.body.scrollHeight);
      } else {
        addMsg("err", friendly || `HTTP ${r.status}`);
      }
      return;
    }

    const data = await r.json();
    thinking.remove();

    let meta = data.tool_used ? `tool: ${data.tool_used}` : "no tool used";
    if (data.usage) {
      const u = data.usage;
      const totalTok = (u.input_tokens || 0) + (u.output_tokens || 0)
                     + (u.cache_read_input_tokens || 0)
                     + (u.cache_creation_input_tokens || 0);
      meta += `  ·  ${totalTok} tok (in ${u.input_tokens}, out ${u.output_tokens}`
            + (u.cache_read_input_tokens     ? `, cache-r ${u.cache_read_input_tokens}`     : "")
            + (u.cache_creation_input_tokens ? `, cache-w ${u.cache_creation_input_tokens}` : "")
            + ")";
    }
    if (data.cost_usd != null) meta += `  ·  $${data.cost_usd.toFixed(5)}`;

    const botText = data.text || "(no text)";
    addMsg("bot", botText, meta);
    if (data.chart_spec) addChart(data.chart_spec);
    if (data.table)      addTable(data.table);
    if (data.api_calls)  addApiCalls(data.api_calls);
    if (data.assistant_message_id) addFeedback(data.assistant_message_id, null);

    // Server is the authority for conversation_id — it may have generated a
    // fresh one if we passed null on the first turn. Persist either way.
    if (data.conversation_id) {
      conversationId = data.conversation_id;
      localStorage.setItem(conversationKey, conversationId);
    }

    history.push({ role: "user", content: msg });
    history.push({ role: "assistant", content: botText });
    messages.push({ role: "user", text: msg, id: data.user_message_id || null });
    messages.push({ role: "bot",  text: botText, meta,
                    id:         data.assistant_message_id || null,
                    chart_spec: data.chart_spec || null,
                    table:      data.table      || null,
                    api_calls:  data.api_calls  || null });
    persist();
  } catch (e) {
    thinking.remove();
    addMsg("err", "Network error: " + e.message);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
