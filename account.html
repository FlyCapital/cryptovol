<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account — CryptoVol</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff;
      --text: #111827; --text2: #6b7280; --text3: #b0b8c4;
      --blue: #1F6FBF; --border: #e3e7ed;
      --sans: 'Inter', sans-serif; --mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px; min-height:100vh; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:20px 32px; }
    .logo { font-family:var(--sans); font-size:17px; font-weight:800; letter-spacing:-0.3px; color:var(--text); text-decoration:none; }
    .logo span { color:var(--blue); }
    .nav-link { color:var(--text2); text-decoration:none; font-size:12px; letter-spacing:0.04em; margin-left:20px; }
    .nav-link:hover { color:var(--text); }
    main { max-width:680px; margin:48px auto 0; padding:0 24px; }
    h1 {
      font-family:var(--sans);
      font-size:clamp(28px,4vw,44px);
      font-weight:800;
      letter-spacing:-1px;
      line-height:1.1;
      text-align:center;
      margin:0 0 12px;
      color:var(--text);
    }
    h1 em { font-style:normal; color:var(--blue); }
    .tagline { color:var(--text2); font-size:13px; line-height:1.7; text-align:center; margin:0 0 36px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:24px 28px; margin-bottom:14px; }
    .card-title { font-family:var(--mono); font-size:11px; font-weight:400; color:var(--text2); text-transform:uppercase; letter-spacing:0.1em; margin:0 0 14px; }
    .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
    .row:last-child { border-bottom:none; }
    .row-label { color:var(--text2); }
    .row-val   { color:var(--text); font-weight:500; }
    .tier-badge { display:inline-block; padding:3px 10px; border-radius:3px; font-size:11px; letter-spacing:0.08em; }
    .tier-BASIC { background:rgba(107,114,128,0.12); color:var(--text2); }
    .tier-PRO   { background:rgba(31,111,191,0.12); color:var(--blue); }
    .tier-ULTRA { background:rgba(31,111,191,0.18); color:var(--blue); font-weight:600; }
    .key-box { background:#f8fafc; border:1px solid var(--border); border-radius:4px; padding:12px 14px; font-size:12px; word-break:break-all; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .key-box code { font-family:var(--mono); color:var(--text); }
    button {
      font-family:var(--mono);
      font-size:12px;
      background:var(--blue);
      color:#fff;
      border:1px solid var(--blue);
      padding:8px 16px;
      border-radius:4px;
      cursor:pointer;
      letter-spacing:0.04em;
      transition:background 0.15s;
    }
    button:hover { background:#1a5fa3; }
    button.secondary { background:transparent; color:var(--blue); }
    button.secondary:hover { background:rgba(31,111,191,0.06); }
    button:disabled { background:var(--text3); border-color:var(--text3); color:#fff; cursor:not-allowed; }
    button:disabled:hover { background:var(--text3); }
    .actions { margin-top:14px; display:flex; gap:10px; }
    .empty { text-align:center; padding:80px 20px; color:var(--text2); }
    .err { color:#b91c1c; font-size:12px; margin-top:8px; text-align:center; }
    .ok-flash { color:#15803d; font-size:11px; margin-left:8px; opacity:0; transition:opacity 0.2s; }
    .ok-flash.show { opacity:1; }
    .upgrade-cta { color:var(--text2); font-size:11px; margin-top:8px; }
    .upgrade-cta code { background:#f8fafc; border:1px solid var(--border); padding:1px 6px; border-radius:3px; }
    .usage-bar { height:6px; background:#f1f5f9; border-radius:3px; overflow:hidden; margin-top:10px; }
    .usage-bar > div { height:100%; background:var(--blue); transition:width 0.3s; }
    .usage-bar.warn  > div { background:#d97706; }
    .usage-bar.crit  > div { background:#b91c1c; }
    .usage-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-top:6px; }
    .card.danger { border-color:rgba(185,28,28,0.25); }
    .card.danger .card-title { color:#b91c1c; }
    button.danger {
      background:#b91c1c; border-color:#b91c1c; color:#fff;
    }
    button.danger:hover { background:#991b1b; border-color:#991b1b; }
    button.danger-secondary {
      background:transparent; border:1px solid #b91c1c; color:#b91c1c;
    }
    button.danger-secondary:hover { background:rgba(185,28,28,0.08); }
  </style>

  <script defer crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsuY3J5cHRvdm9sLmlvJA"
    src="https://clerk.cryptovol.io/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"></script>
</head>
<body>
  <div class="topbar">
    <a href="/" class="logo">crypto<span>vol</span></a>
    <div id="topbar-right">
      <a href="/" class="nav-link">Home</a>
      <a href="/api" class="nav-link">API</a>
      <a href="/chat" class="nav-link">Chat</a>
      <span id="user-button-slot"></span>
    </div>
  </div>

  <main>
    <div id="content" class="empty">Loading…</div>
  </main>

  <script>
    const API_BASE = "https://cryptovol-api-nbakzshi6q-uc.a.run.app";

    window.addEventListener('load', async () => {
      await window.Clerk.load();

      const content = document.getElementById('content');

      if (!window.Clerk.user) {
        // Not logged in → redirect to login
        window.location.href = '/login';
        return;
      }

      // Mount the user button (signs out)
      window.Clerk.mountUserButton(document.getElementById('user-button-slot'), {
        afterSignOutUrl: '/login',
      });

      const token = await window.Clerk.session.getToken();
      let user;
      try {
        const resp = await fetch(`${API_BASE}/v1/account/me`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        if (resp.status === 404) {
          // Webhook race — retry once after 2s
          await new Promise(r => setTimeout(r, 2000));
          const retry = await fetch(`${API_BASE}/v1/account/me`, {
            headers: { 'Authorization': `Bearer ${token}` },
          });
          if (!retry.ok) throw new Error('Account not provisioned. Please refresh in a moment.');
          user = await retry.json();
        } else if (!resp.ok) {
          throw new Error(`Server returned ${resp.status}`);
        } else {
          user = await resp.json();
        }
      } catch (e) {
        content.innerHTML = `<div class="err">${e.message}</div>`;
        return;
      }

      // Show success banner only when the user just returned from Stripe Checkout
      // AND the tier hasn't updated yet (webhook still in flight). Once tier reflects
      // the upgrade, suppress the banner and strip ?upgraded=true so a refresh stays clean.
      const params = new URLSearchParams(window.location.search);
      const justReturned   = params.get('upgraded') === 'true';
      const upgradePending = justReturned && user.tier === 'BASIC';
      const upgradedBanner = upgradePending ? `
        <div style="background:rgba(31,111,191,0.08); border:1px solid rgba(31,111,191,0.2); color:var(--blue); padding:10px 14px; border-radius:4px; margin-bottom:18px; font-size:12px;">
          &check; Payment received. Tier updating &mdash; this page will refresh automatically in a few seconds.
        </div>` : '';
      if (justReturned && !upgradePending) {
        // Upgrade has landed; remove the query param so refreshes don't keep showing it.
        history.replaceState({}, '', '/account');
      }
      if (upgradePending) {
        // Poll for the tier change so we don't make the user refresh manually.
        setTimeout(() => window.location.reload(), 3000);
      }

      const showManageBilling = user.tier !== 'BASIC';
      const showUpgradePro    = user.tier === 'BASIC';
      const showUpgradeUltra  = user.tier !== 'ULTRA';

      content.innerHTML = `
        <h1>Your <em>account</em></h1>
        <p class="tagline">Manage your API key and subscription.</p>

        ${upgradedBanner}

        <div class="card">
          <p class="card-title">Profile</p>
          <div class="row">
            <span class="row-label">Email</span>
            <span class="row-val">${user.email}</span>
          </div>
          <div class="row">
            <span class="row-label">Plan</span>
            <span class="row-val"><span class="tier-badge tier-${user.tier}">${user.tier}</span></span>
          </div>
          <div class="row">
            <span class="row-label">Member since</span>
            <span class="row-val">${user.created_at ? user.created_at.slice(0,10) : '—'}</span>
          </div>
        </div>

        ${(() => {
          // Render one usage card for each non-null bucket on the user (api + chat).
          const usageCard = (label, u) => {
            if (!u) return '';
            const pct = Math.min(100, (u.used / u.limit) * 100);
            const cls = pct >= 90 ? 'crit' : pct >= 75 ? 'warn' : '';
            return `
              <div class="card">
                <p class="card-title">${label} &mdash; this ${u.period}</p>
                <div class="row">
                  <span class="row-label">${label === 'Chat' ? 'Messages' : 'Requests'}</span>
                  <span class="row-val">${u.used.toLocaleString()} / ${u.limit.toLocaleString()}</span>
                </div>
                <div class="usage-bar ${cls}"><div style="width:${pct}%"></div></div>
                <div class="usage-meta">
                  <span>${pct.toFixed(1)}% used</span>
                  <span>Resets at start of next ${u.period}</span>
                </div>
              </div>`;
          };
          return usageCard('API usage',  user.usage) + usageCard('Chat', user.chat_usage);
        })()}

        <div class="card">
          <p class="card-title">API key</p>
          <div class="key-box">
            <code id="api-key">${user.api_key}</code>
            <div>
              <button id="copy-btn">Copy</button>
              <span id="copy-ok" class="ok-flash">copied</span>
            </div>
          </div>
          <p class="upgrade-cta">Send as <code>X-CryptoVol-Key</code> header on API requests.</p>
          <div class="actions">
            <button id="rotate-btn" class="secondary">Rotate key</button>
          </div>
        </div>

        <div class="card danger" style="margin-top:32px;">
          <p class="card-title">Danger zone</p>
          <p style="color:var(--text2); font-size:12px; margin:0 0 12px;">
            Permanently delete your account, revoke your API key, and cancel your subscription.
            Stripe payment records are retained for accounting compliance but anonymized.
            <strong>This cannot be undone.</strong>
          </p>
          <div class="actions">
            <button id="delete-btn" class="danger-secondary">Delete my account</button>
          </div>
        </div>

        <div class="card">
          <p class="card-title">Subscription</p>
          <div class="row">
            <span class="row-label">Tier</span>
            <span class="row-val">${user.tier}</span>
          </div>
          <div class="actions">
            ${showUpgradePro   ? `<button data-tier="PRO"   class="upgrade-btn">Upgrade to PRO &mdash; $49/mo</button>`   : ''}
            ${showUpgradeUltra ? `<button data-tier="ULTRA" class="upgrade-btn ${showUpgradePro ? 'secondary' : ''}">Upgrade to ULTRA &mdash; $99/mo</button>` : ''}
            ${showManageBilling ? `<button id="portal-btn" class="secondary">Manage billing</button>` : ''}
          </div>
        </div>
      `;

      // Copy-to-clipboard
      document.getElementById('copy-btn').addEventListener('click', async () => {
        await navigator.clipboard.writeText(user.api_key);
        const flash = document.getElementById('copy-ok');
        flash.classList.add('show');
        setTimeout(() => flash.classList.remove('show'), 1500);
      });

      // Rotate key
      document.getElementById('rotate-btn').addEventListener('click', async () => {
        if (!confirm('Rotate your API key? The current key will stop working immediately.')) return;
        const t = await window.Clerk.session.getToken();
        const resp = await fetch(`${API_BASE}/v1/account/rotate-key`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${t}` },
        });
        if (!resp.ok) { alert('Failed to rotate key'); return; }
        const j = await resp.json();
        document.getElementById('api-key').textContent = j.api_key;
        user.api_key = j.api_key;
      });

      // Upgrade buttons → Stripe Checkout
      document.querySelectorAll('.upgrade-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Redirecting...';
          try {
            const t = await window.Clerk.session.getToken();
            const resp = await fetch(`${API_BASE}/v1/account/checkout`, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${t}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ tier: btn.dataset.tier }),
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`Server returned ${resp.status}: ${err.slice(0, 200)}`);
            }
            const { url } = await resp.json();
            window.location.href = url;
          } catch (e) {
            alert('Could not start checkout: ' + e.message);
            btn.disabled = false;
            btn.textContent = `Upgrade to ${btn.dataset.tier}`;
          }
        });
      });

      // Danger zone → delete account
      document.getElementById('delete-btn').addEventListener('click', async () => {
        const typed = prompt(
          "This permanently deletes your account, cancels your subscription, " +
          "and revokes your API key. Stripe payment records will be retained " +
          "but anonymized.\n\n" +
          "Type DELETE to confirm:"
        );
        if (typed !== 'DELETE') return;

        const t = await window.Clerk.session.getToken();
        try {
          const resp = await fetch(`${API_BASE}/v1/account/delete-me`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${t}` },
          });
          if (!resp.ok) {
            const err = await resp.text();
            throw new Error(`Server returned ${resp.status}: ${err.slice(0, 200)}`);
          }
          // Sign out locally and redirect to login. The Clerk identity is already deleted
          // server-side, so the session is invalid — Clerk.signOut() just clears the local state.
          await window.Clerk.signOut({ redirectUrl: '/login' });
        } catch (e) {
          alert('Could not delete account: ' + e.message);
        }
      });

      // Manage billing → Stripe Customer Portal
      const portalBtn = document.getElementById('portal-btn');
      if (portalBtn) {
        portalBtn.addEventListener('click', async () => {
          portalBtn.disabled = true;
          portalBtn.textContent = 'Loading...';
          try {
            const t = await window.Clerk.session.getToken();
            const resp = await fetch(`${API_BASE}/v1/account/portal`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${t}` },
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`Server returned ${resp.status}: ${err.slice(0, 200)}`);
            }
            const { url } = await resp.json();
            window.location.href = url;
          } catch (e) {
            alert('Could not open billing portal: ' + e.message);
            portalBtn.disabled = false;
            portalBtn.textContent = 'Manage billing';
          }
        });
      }
    });
  </script>
</body>
</html>
