<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign up — CryptoVol</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff;
      --text: #111827; --text2: #6b7280; --text3: #b0b8c4;
      --blue: #1F6FBF; --border: #e3e7ed;
      --sans: 'Inter', sans-serif; --mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px; min-height:100vh; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:20px 32px; background:rgba(255,255,255,0.9); border-bottom:1px solid var(--border); }
    .logo { font-family:var(--sans); font-size:17px; font-weight:800; letter-spacing:-0.3px; color:var(--text); text-decoration:none; }
    .logo span { color:var(--blue); }
    .nav-link { color:var(--text2); text-decoration:none; font-size:12px; letter-spacing:0.04em; margin-left:20px; }
    .nav-link:hover { color:var(--text); }
    main { display:flex; justify-content:center; align-items:flex-start; padding:60px 20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:40px; max-width:440px; width:100%; }
    h1 { font-family:var(--sans); font-size:24px; font-weight:700; letter-spacing:-0.5px; margin:0 0 8px; }
    .sub { color:var(--text2); margin:0 0 24px; font-size:12px; }
    .sub a { color:var(--blue); text-decoration:none; }
    .sub a:hover { text-decoration:underline; }
    #clerk-root { min-height:400px; }
  </style>

  <script defer crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_ZGlyZWN0LWJ1Zy03LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://direct-bug-7.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"></script>
</head>
<body>
  <div class="topbar">
    <a href="/" class="logo">crypto<span>vol</span></a>
    <div>
      <a href="/" class="nav-link">Home</a>
      <a href="/api" class="nav-link">API</a>
      <a href="/login" class="nav-link">Log in</a>
    </div>
  </div>

  <main>
    <div class="card">
      <h1>Create your account</h1>
      <p class="sub">Free BASIC tier — no card required. Already have an account? <a href="/login">Log in</a>.</p>
      <div id="clerk-root"></div>
    </div>
  </main>

  <script>
    window.addEventListener('load', async () => {
      await window.Clerk.load();
      window.Clerk.mountSignUp(document.getElementById('clerk-root'), {
        signInUrl: '/login',
        afterSignUpUrl: '/account',
      });
    });
  </script>
</body>
</html>
