<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign up — CryptoVol</title>
  <!-- Google Ads (gtag.js) — conversion tracking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18214921102"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18214921102');
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #faf9f5;
      --surface:   #ffffff;
      --surface2:  #f5f4ef;
      --text:      #0f172a;
      --text2:     #475569;
      --text3:     #94a3b8;
      --border:    rgba(15, 23, 42, 0.08);
      --border2:   rgba(15, 23, 42, 0.14);
      --blue:      #1F6FBF;
      --black:     #0f172a;
      --sans:      'Inter', sans-serif;
      --serif:     'Source Serif 4', Georgia, serif;
    }
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 15px; line-height: 1.6;
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    nav {
      background: rgba(250, 249, 245, 0.85);
      backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1180px; margin: 0 auto; padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .logo { font-family: var(--sans); font-size: 19px; font-weight: 800; letter-spacing: -0.4px; color: var(--text); text-decoration: none; }
    .logo span { color: var(--blue); }
    .nav-aux { color: var(--text2); font-family: var(--sans); font-size: 14px; font-weight: 500; text-decoration: none; }
    .nav-aux:hover { color: var(--text); }

    main {
      max-width: 440px; margin: 64px auto 0; padding: 0 24px 64px;
      text-align: center;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(34px, 5vw, 44px);
      font-weight: 500; letter-spacing: -1.4px; line-height: 1.08;
      margin: 0 0 12px; color: var(--text);
    }
    h1 em { font-style: normal; color: var(--blue); font-family: inherit; font-weight: inherit; }
    .tagline { color: var(--text2); font-size: 15px; line-height: 1.5; margin: 0 0 28px; }

    .card-wrap {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    #clerk-root { width:100%; }
    .below-card { margin-top: 20px; font-size: 14px; color: var(--text2); }
    .below-card a { color: var(--text); text-decoration: underline; font-weight: 500; }
    .below-card a:hover { color: var(--blue); }

    /* Hide every Clerk "Last used" badge variant */
    .cl-socialButtonsBlockButton__lastUsed,
    .cl-socialButtonsBlockButtonText__lastUsed,
    .cl-internal-lastUsed,
    .cl-providerInfo,
    .cl-socialButtonsBlockButton [class*="lastUsed" i],
    .cl-socialButtonsBlockButton [class*="LastUsed"],
    .cl-socialButtonsBlockButton [class*="last-used" i],
    [class*="lastUsed" i],
    [class*="last-used" i],
    [data-localization-key*="lastUsed" i],
    [data-localization-key*="last_used" i] {
      display: none !important;
      visibility: hidden !important;
    }
    .cl-socialButtonsBlockButton { overflow: hidden !important; position: relative !important; }

    .cl-socialButtonsBlockButton,
    .cl-socialButtonsBlockButton *,
    .cl-socialButtons button,
    .cl-socialButtons button *,
    .cl-formFieldInput,
    .cl-formButtonPrimary,
    .cl-formButtonPrimary *,
    button[class*="cl-socialButtons"],
    button[class*="cl-formButtonPrimary"] {
      border-radius: 14px !important;
      border-top-left-radius: 14px !important;
      border-top-right-radius: 14px !important;
      border-bottom-left-radius: 14px !important;
      border-bottom-right-radius: 14px !important;
      box-shadow: none !important;
      -webkit-box-shadow: none !important;
      background-image: none !important;
      filter: none !important;
      -webkit-filter: none !important;
      text-shadow: none !important;
      transform: none !important;
    }
    .cl-socialButtonsBlockButton,
    .cl-socialButtons button,
    .cl-formFieldInput,
    .cl-formButtonPrimary {
      min-height: 48px !important;
      font-size: 15px !important;
    }
    .cl-socialButtonsBlockButton::before,
    .cl-socialButtonsBlockButton::after,
    .cl-socialButtonsBlockButton *::before,
    .cl-socialButtonsBlockButton *::after,
    .cl-formButtonPrimary::before,
    .cl-formButtonPrimary::after,
    .cl-formButtonPrimary *::before,
    .cl-formButtonPrimary *::after,
    .cl-formFieldInput::before,
    .cl-formFieldInput::after {
      content: none !important;
      display: none !important;
      background: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    /* Catch-all override - see login.html for rationale */
    [class*="cl-"][class*="Button"],
    [class*="cl-"][class*="Button"] *,
    [class*="cl-"][class*="button"],
    [class*="cl-"][class*="button"] *,
    button[class*="cl-"],
    button[class*="cl-"] * {
      border-radius: 14px !important;
      border-top-left-radius: 14px !important;
      border-top-right-radius: 14px !important;
      border-bottom-left-radius: 14px !important;
      border-bottom-right-radius: 14px !important;
      box-shadow: none !important;
      -webkit-box-shadow: none !important;
      outline: none !important;
      filter: none !important;
      -webkit-filter: none !important;
      background-image: none !important;
      -webkit-mask: none !important;
      mask: none !important;
      clip-path: none !important;
      transform: none !important;
    }

    .cl-socialButtonsBlockButton {
      background: var(--surface) !important;
      border: 1px solid var(--border2) !important;
      color: var(--text) !important;
      transition: background 0.15s, border-color 0.15s !important;
    }
    .cl-socialButtonsBlockButton:hover {
      background: #fafafa !important;
      border-color: var(--text2) !important;
    }
    .cl-socialButtonsBlockButtonText { font-weight: 500 !important; font-size: 15px !important; }

    .cl-formFieldInput {
      background: var(--surface) !important;
      border: 1px solid var(--border2) !important;
      color: var(--text) !important;
      transition: border-color 0.15s, box-shadow 0.15s !important;
    }
    .cl-formFieldInput:focus {
      border-color: var(--text) !important;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08) !important;
      outline: none !important;
    }

    .cl-formButtonPrimary {
      background: var(--black) !important;
      border: 1px solid var(--black) !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      transition: background 0.15s !important;
    }
    .cl-formButtonPrimary:hover {
      background: #1e293b !important;
      border-color: #1e293b !important;
    }
    .cl-formButtonPrimary svg,
    .cl-formButtonPrimary .cl-buttonArrowIcon { display: none !important; }

    .cl-formFieldLabel { display: none !important; }
    .cl-formField { margin-bottom: 8px !important; }

    /* ─── Corner fix (authoritative — wins by source order) ────────────
       One clip defines the shape: the button/input element itself owns the
       14px radius and clips its own contents. Every DESCENDANT gets radius 0
       so no nested rounded corner sits inside the parent's and offsets it. */
    .cl-socialButtonsBlockButton,
    .cl-socialButtons button,
    .cl-formFieldInput,
    .cl-formButtonPrimary,
    button[class*="cl-socialButtons"],
    button[class*="cl-formButtonPrimary"] {
      border-radius: 14px !important;
      overflow: hidden !important;
    }
    .cl-socialButtonsBlockButton *,
    .cl-socialButtons button *,
    .cl-formButtonPrimary *,
    button[class*="cl-socialButtons"] *,
    button[class*="cl-formButtonPrimary"] * {
      border-radius: 0 !important;
    }

    /* Primary "Continue" button: Clerk styles the solid variant with a
       pill radius via a stylesheet it injects at runtime — AFTER this
       <style> — so an equal-specificity rule loses the cascade. Chain the
       data-variant/data-color attributes to out-specify it outright. */
    button.cl-formButtonPrimary,
    button.cl-formButtonPrimary[data-variant="solid"],
    button.cl-formButtonPrimary[data-variant="solid"][data-color="primary"],
    button.cl-button[data-variant="solid"][data-color="primary"] {
      border-radius: 14px !important;
    }

    /* Verification code (OTP): the box group is left-aligned by default, so
       the leftmost box gets clipped at the card edge. Center it both ways
       (align-items handles the column-flex case) WITHOUT resizing the boxes —
       they're rendered by input-otp and collapse if flexed. Classes/wrapper
       confirmed from the rendered DOM. */
    .cl-otpCodeField {
      display: flex !important;
      width: 100% !important;
      align-items: center !important;
      justify-content: center !important;
      margin-top: 12px !important;
    }
    .cl-otpCodeFieldInputContainer,
    .cl-otpCodeFieldInputs {
      align-items: center !important;
      justify-content: center !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    [data-input-otp-container] {
      margin-left: auto !important;
      margin-right: auto !important;
    }

    /* Remove Clerk's "Last used" badge */
    .cl-badge { display: none !important; }
  </style>

  <script defer crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsuY3J5cHRvdm9sLmlvJA"
    src="https://clerk.cryptovol.io/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"></script>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">crypto<span>vol</span></a>
      <a href="/" class="nav-aux">← Home</a>
    </div>
  </nav>

  <main>
    <h1>Create your <em>account</em></h1>
    <p class="tagline">Institutional-grade crypto vol data. Free BASIC tier — no card required.</p>

    <div class="card-wrap">
      <div id="clerk-root"></div>
    </div>

    <p class="below-card">Already have an account? <a href="/login">Log in</a></p>
  </main>

  <script>
    const CLERK_APPEARANCE = {
      variables: {
        colorPrimary: '#0f172a',
        colorText: '#0f172a',
        colorTextSecondary: '#475569',
        colorBackground: '#f5f4ef',
        colorInputBackground: '#ffffff',
        colorInputText: '#0f172a',
        fontFamily: '"Inter", sans-serif',
        fontSize: '15px',
        borderRadius: '14px',
        spacingUnit: '0.85rem',
      },
      elements: {
        rootBox: { width: '100%' },
        cardBox: { boxShadow: 'none', border: 'none', background: 'transparent', width: '100%' },
        card: { boxShadow: 'none', border: 'none', padding: 0, background: 'transparent' },
        header: { display: 'none' },
        footer: { display: 'none' },
        socialButtonsBlockButtonText: { fontWeight: 500 },
        dividerRow: { margin: '18px 0' },
        dividerLine: { background: 'rgba(15, 23, 42, 0.10)', height: '1px' },
        dividerText: {
          fontFamily: '"Inter", sans-serif',
          fontSize: '12px',
          color: '#94a3b8',
          textTransform: 'uppercase',
          letterSpacing: '0.1em',
        },
        formFieldInput: { background: '#ffffff', color: '#0f172a' },
        identityPreview: { fontFamily: '"Inter", sans-serif', fontSize: '14px' },
        formResendCodeLink: { color: '#1F6FBF', fontFamily: '"Inter", sans-serif' },
      },
    };

    // Hide the "Last used" badge wherever Clerk renders it. Class selectors
    // miss it (hashed class names), so match on the visible text: find any
    // leaf whose text is "Last used", climb to the outermost wrapper that
    // still contains only that text (the pill), and hide it.
    function hideClerkLastUsed() {
      const root = document.getElementById('clerk-root') || document.body;
      root.querySelectorAll('*').forEach(el => {
        if (el.children.length) return;                      // leaf nodes only
        if ((el.textContent || '').trim().toLowerCase() !== 'last used') return;
        let node = el;
        while (node.parentElement && node.parentElement !== root &&
               (node.parentElement.textContent || '').trim().toLowerCase() === 'last used') {
          node = node.parentElement;                         // climb to the pill
        }
        node.style.display = 'none';
        node.style.visibility = 'hidden';
      });
    }

    // The verification-code widget (input-otp) measures its container at mount,
    // before the card/fonts settle, and lays the 6 boxes out for a stale width —
    // clipping the left box until a reflow re-measures it (which is why it looks
    // right only once a warning/message pushes the layout). Force that reflow by
    // dispatching a resize the moment the OTP appears.
    let otpNudged = false;
    function nudgeOtpReflow() {
      const otp = document.querySelector('[data-input-otp-container]');
      if (!otp) { otpNudged = false; return; }
      if (otpNudged) return;
      otpNudged = true;
      [0, 60, 200, 500].forEach(t =>
        setTimeout(() => window.dispatchEvent(new Event('resize')), t));
    }

    window.addEventListener('load', async () => {
      await window.Clerk.load();

      // Google Ads — sign-up conversion. Set this to the conversion label from
      // Google Ads (format 'AW-18214921102/XXXXXXXXXXXX') to enable it. While
      // null, no conversion fires (safe to ship). It is reported ONLY here, on a
      // genuine new account: an already-signed-in visitor is redirected below
      // before the listener is added, and sign-in happens on /login — so this
      // never counts sign-ins, /account revisits, or plain page views.
      const ADS_SIGNUP_CONVERSION = null;  // e.g. 'AW-18214921102/abcdEFgh12'
      let signupConversionFired = false;

      if (window.Clerk.user) { window.location.replace('/account'); return; }
      window.Clerk.addListener(({ user }) => {
        if (!user) return;
        const go = () => window.location.replace('/account');
        if (ADS_SIGNUP_CONVERSION && !signupConversionFired) {
          signupConversionFired = true;
          let done = false;
          const once = () => { if (!done) { done = true; go(); } };
          // Wait for the conversion beacon, but redirect anyway after 1s.
          gtag('event', 'conversion', { send_to: ADS_SIGNUP_CONVERSION, event_callback: once });
          setTimeout(once, 1000);
        } else {
          go();
        }
      });

      const obs = new MutationObserver(() => { hideClerkLastUsed(); nudgeOtpReflow(); });
      obs.observe(document.body, { childList: true, subtree: true });

      window.Clerk.mountSignUp(document.getElementById('clerk-root'), {
        signInUrl: '/login',
        signUpForceRedirectUrl: '/account',
        signUpFallbackRedirectUrl: '/account',
        forceRedirectUrl: '/account',
        fallbackRedirectUrl: '/account',
        appearance: CLERK_APPEARANCE,
      });
    });
  </script>
</body>
</html>
