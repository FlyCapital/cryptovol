<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Log in — CryptoVol</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --text2: #6b7280;
      --text3: #b0b8c4;
      --border: #e3e7ed;
      --blue: #1F6FBF;
      --sans: 'Inter', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px; min-height:100vh; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:20px 32px; }
    .logo { font-family:var(--sans); font-size:17px; font-weight:800; letter-spacing:-0.3px; color:var(--text); text-decoration:none; }
    .logo span { color:var(--blue); }
    .nav-link { color:var(--text2); text-decoration:none; font-size:12px; letter-spacing:0.04em; margin-left:20px; }
    .nav-link:hover { color:var(--text); }
    main { max-width:440px; margin:64px auto 0; padding:0 24px; text-align:center; }
    h1 {
      font-family:var(--sans);
      font-size:clamp(28px,4vw,44px);
      font-weight:800;
      letter-spacing:-1px;
      line-height:1.1;
      margin:0 0 12px;
      color:var(--text);
    }
    h1 em { font-style:normal; color:var(--blue); }
    .tagline { color:var(--text2); font-size:13px; line-height:1.7; margin:0 0 32px; }
    .card-wrap {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:6px;
      padding:28px;
    }
    #clerk-root { width:100%; }
    .below-card { margin-top:18px; font-size:12px; color:var(--text2); }
    .below-card a { color:var(--blue); text-decoration:none; }
    .below-card a:hover { text-decoration:underline; }
  </style>

  <script defer crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsuY3J5cHRvdm9sLmlvJA"
    src="https://clerk.cryptovol.io/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"></script>
</head>
<body>
  <div class="topbar">
    <a href="/" class="logo">crypto<span>vol</span></a>
    <div>
      <a href="/" class="nav-link">Home</a>
      <a href="/api" class="nav-link">API</a>
      <a href="/signup" class="nav-link">Sign up</a>
    </div>
  </div>

  <main>
    <h1>Welcome <em>back</em></h1>
    <p class="tagline">Log in to view your API key<br/>and manage your subscription.</p>

    <div class="card-wrap">
      <div id="clerk-root"></div>
    </div>

    <p class="below-card">New to CryptoVol? <a href="/signup">Create an account</a></p>
  </main>

  <script>
    const CLERK_APPEARANCE = {
      variables: {
        colorPrimary: '#1F6FBF',
        colorText: '#111827',
        colorTextSecondary: '#6b7280',
        colorBackground: '#ffffff',
        colorInputBackground: '#ffffff',
        colorInputText: '#111827',
        fontFamily: '"IBM Plex Mono", monospace',
        fontSize: '13px',
        borderRadius: '4px',
        spacingUnit: '0.9rem',
      },
      elements: {
        rootBox: { width: '100%' },
        cardBox: { boxShadow: 'none', border: 'none', background: 'transparent', width: '100%' },
        card: { boxShadow: 'none', border: 'none', padding: 0, background: 'transparent' },
        header: { display: 'none' },
        footer: { display: 'none' },
        socialButtonsBlockButton: {
          border: '1px solid #e3e7ed',
          background: '#ffffff',
          fontFamily: '"IBM Plex Mono", monospace',
          fontSize: '13px',
          fontWeight: 400,
          letterSpacing: '0.02em',
          padding: '9px 14px',
          '&:hover': { background: '#f8fafc' },
        },
        socialButtonsBlockButtonText: { fontWeight: 400 },
        formFieldLabel: {
          fontFamily: '"IBM Plex Mono", monospace',
          fontSize: '11px',
          color: '#6b7280',
          fontWeight: 400,
          letterSpacing: '0.04em',
          textTransform: 'uppercase',
        },
        formFieldInput: {
          fontFamily: '"IBM Plex Mono", monospace',
          fontSize: '13px',
          border: '1px solid #e3e7ed',
          background: '#ffffff',
          padding: '9px 12px',
          color: '#111827',
        },
        formButtonPrimary: {
          background: '#1F6FBF',
          fontFamily: '"IBM Plex Mono", monospace',
          fontSize: '12px',
          fontWeight: 400,
          letterSpacing: '0.04em',
          textTransform: 'none',
          padding: '10px 16px',
          '&:hover': { background: '#1a5fa3' },
        },
        dividerRow: { margin: '14px 0' },
        dividerLine: { background: '#e3e7ed' },
        dividerText: {
          fontFamily: '"IBM Plex Mono", monospace',
          fontSize: '10px',
          color: '#b0b8c4',
          textTransform: 'uppercase',
          letterSpacing: '0.1em',
        },
        identityPreview: { fontFamily: '"IBM Plex Mono", monospace', fontSize: '12px' },
        formResendCodeLink: { color: '#1F6FBF', fontFamily: '"IBM Plex Mono", monospace' },
      },
    };

    window.addEventListener('load', async () => {
      await window.Clerk.load();
      window.Clerk.mountSignIn(document.getElementById('clerk-root'), {
        signUpUrl: '/signup',
        signInForceRedirectUrl: '/account',
        signInFallbackRedirectUrl: '/account',
        forceRedirectUrl: '/account',
        fallbackRedirectUrl: '/account',
        appearance: CLERK_APPEARANCE,
      });
    });
  </script>
</body>
</html>
