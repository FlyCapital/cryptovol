<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Log in — CryptoVol</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #faf9f5;
      --surface:   #ffffff;
      --surface2:  #f5f4ef;
      --text:      #0f172a;
      --text2:     #475569;
      --text3:     #94a3b8;
      --border:    rgba(15, 23, 42, 0.08);
      --border2:   rgba(15, 23, 42, 0.14);
      --blue:      #1F6FBF;
      --black:     #0f172a;
      --sans:      'Inter', sans-serif;
      --mono:      'IBM Plex Mono', monospace;
      --serif:     'Source Serif 4', Georgia, serif;
    }
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 15px; line-height: 1.6;
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    nav {
      background: rgba(250, 249, 245, 0.85);
      backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1180px; margin: 0 auto; padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .logo {
      font-family: var(--sans); font-size: 19px; font-weight: 800;
      letter-spacing: -0.4px; color: var(--text); text-decoration: none;
    }
    .logo span { color: var(--blue); }
    .nav-aux {
      color: var(--text2); font-family: var(--sans); font-size: 14px;
      font-weight: 500; text-decoration: none;
    }
    .nav-aux:hover { color: var(--text); }

    main {
      max-width: 440px; margin: 64px auto 0; padding: 0 24px 64px;
      text-align: center;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(32px, 4.5vw, 44px);
      font-weight: 500; letter-spacing: -1px; line-height: 1.08;
      margin: 0 0 14px; color: var(--text);
    }
    h1 em { font-style: normal; color: var(--blue); }
    .tagline {
      color: var(--text2); font-size: 15px; line-height: 1.6; margin: 0 0 32px;
    }
    .card-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    #clerk-root { width:100%; }
    .below-card { margin-top: 22px; font-size: 14px; color: var(--text2); }
    .below-card a { color: var(--blue); text-decoration: none; font-weight: 500; }
    .below-card a:hover { text-decoration: underline; }
  </style>

  <script defer crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsuY3J5cHRvdm9sLmlvJA"
    src="https://clerk.cryptovol.io/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"></script>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">crypto<span>vol</span></a>
      <a href="/" class="nav-aux">← Home</a>
    </div>
  </nav>

  <main>
    <h1>Welcome <em>back</em></h1>
    <p class="tagline">Log in to view your API key and manage your subscription.</p>

    <div class="card-wrap">
      <div id="clerk-root"></div>
    </div>

    <p class="below-card">New to CryptoVol? <a href="/signup">Create an account</a></p>
  </main>

  <script>
    const CLERK_APPEARANCE = {
      variables: {
        colorPrimary: '#1F6FBF',
        colorText: '#0f172a',
        colorTextSecondary: '#475569',
        colorBackground: '#ffffff',
        colorInputBackground: '#ffffff',
        colorInputText: '#0f172a',
        fontFamily: '"Inter", sans-serif',
        fontSize: '14px',
        borderRadius: '8px',
        spacingUnit: '1rem',
      },
      elements: {
        rootBox: { width: '100%' },
        cardBox: { boxShadow: 'none', border: 'none', background: 'transparent', width: '100%' },
        card: { boxShadow: 'none', border: 'none', padding: 0, background: 'transparent' },
        header: { display: 'none' },
        footer: { display: 'none' },
        socialButtonsBlockButton: {
          border: '1px solid rgba(15, 23, 42, 0.14)',
          background: '#ffffff',
          fontFamily: '"Inter", sans-serif',
          fontSize: '14px',
          fontWeight: 500,
          padding: '10px 14px',
          '&:hover': { background: '#f5f4ef' },
        },
        socialButtonsBlockButtonText: { fontWeight: 500 },
        formFieldLabel: {
          fontFamily: '"Inter", sans-serif',
          fontSize: '12px',
          color: '#475569',
          fontWeight: 500,
          letterSpacing: '0.02em',
        },
        formFieldInput: {
          fontFamily: '"Inter", sans-serif',
          fontSize: '14px',
          border: '1px solid rgba(15, 23, 42, 0.14)',
          background: '#ffffff',
          padding: '10px 12px',
          color: '#0f172a',
        },
        formButtonPrimary: {
          background: '#0f172a',
          fontFamily: '"Inter", sans-serif',
          fontSize: '14px',
          fontWeight: 500,
          textTransform: 'none',
          padding: '11px 16px',
          '&:hover': { background: '#1e293b' },
        },
        dividerRow: { margin: '16px 0' },
        dividerLine: { background: 'rgba(15, 23, 42, 0.08)' },
        dividerText: {
          fontFamily: '"Inter", sans-serif',
          fontSize: '11px',
          color: '#94a3b8',
          textTransform: 'uppercase',
          letterSpacing: '0.08em',
        },
        identityPreview: { fontFamily: '"Inter", sans-serif', fontSize: '13px' },
        formResendCodeLink: { color: '#1F6FBF', fontFamily: '"Inter", sans-serif' },
      },
    };

    window.addEventListener('load', async () => {
      await window.Clerk.load();
      window.Clerk.mountSignIn(document.getElementById('clerk-root'), {
        signUpUrl: '/signup',
        signInForceRedirectUrl: '/account',
        signInFallbackRedirectUrl: '/account',
        forceRedirectUrl: '/account',
        fallbackRedirectUrl: '/account',
        appearance: CLERK_APPEARANCE,
      });
    });
  </script>
</body>
</html>
