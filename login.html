<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Log in — CryptoVol</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f5;
      --card: #ffffff;
      --text: #0f172a;
      --text2: #64748b;
      --text3: #cbd5e1;
      --border: rgba(15, 23, 42, 0.08);
      --blue: #1F6FBF;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Inter', sans-serif;
      --serif: 'Source Serif 4', Georgia, serif;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; }
    .topbar { padding:24px 36px; }
    .logo { font-family:var(--sans); font-size:18px; font-weight:800; letter-spacing:-0.3px; color:var(--text); text-decoration:none; }
    .logo span { color:var(--blue); }
    main { max-width:520px; margin:80px auto 0; padding:0 24px; text-align:center; }
    h1 { font-family:var(--serif); font-size:54px; font-weight:500; letter-spacing:-1.5px; line-height:1.05; margin:0 0 14px; color:var(--text); }
    .tagline { font-family:var(--serif); color:var(--text2); font-size:18px; line-height:1.4; margin:0 auto 36px; max-width:380px; }
    .card-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 28px 24px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }
    #clerk-root { width:100%; }
    .below-card { margin-top:18px; font-size:13px; color:var(--text2); font-family:var(--sans); }
    .below-card a { color:var(--text); font-weight:500; text-decoration:none; }
    .below-card a:hover { text-decoration:underline; }
  </style>

  <script defer crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_ZGlyZWN0LWJ1Zy03LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://direct-bug-7.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"></script>
</head>
<body>
  <div class="topbar">
    <a href="/" class="logo">crypto<span>vol</span></a>
  </div>

  <main>
    <h1>Welcome back</h1>
    <p class="tagline">Log in to view your API key and manage your subscription.</p>

    <div class="card-wrap">
      <div id="clerk-root"></div>
    </div>

    <p class="below-card">New to CryptoVol? <a href="/signup">Create an account</a></p>
  </main>

  <script>
    const CLERK_APPEARANCE = {
      variables: {
        colorPrimary: '#0f172a',
        colorText: '#0f172a',
        colorTextSecondary: '#64748b',
        colorBackground: '#ffffff',
        colorInputBackground: '#ffffff',
        colorInputText: '#0f172a',
        fontFamily: '"Inter", sans-serif',
        fontSize: '14px',
        borderRadius: '10px',
        spacingUnit: '1rem',
      },
      elements: {
        rootBox: { width: '100%' },
        cardBox: { boxShadow: 'none', border: 'none', background: 'transparent', width: '100%' },
        card: { boxShadow: 'none', border: 'none', padding: 0, background: 'transparent' },
        header: { display: 'none' },
        footer: { display: 'none' },
        socialButtonsBlockButton: {
          border: '1px solid rgba(15, 23, 42, 0.12)',
          background: '#ffffff',
          fontFamily: '"Inter", sans-serif',
          fontSize: '14px',
          fontWeight: 500,
          padding: '10px 14px',
          '&:hover': { background: '#f8fafc' },
        },
        socialButtonsBlockButtonText: { fontWeight: 500 },
        formFieldLabel: { fontFamily: '"Inter", sans-serif', fontSize: '13px', color: '#64748b', fontWeight: 500 },
        formFieldInput: {
          fontFamily: '"Inter", sans-serif',
          fontSize: '14px',
          border: '1px solid rgba(15, 23, 42, 0.12)',
          background: '#ffffff',
          padding: '10px 12px',
        },
        formButtonPrimary: {
          background: '#0f172a',
          fontFamily: '"Inter", sans-serif',
          fontSize: '14px',
          fontWeight: 500,
          letterSpacing: 0,
          textTransform: 'none',
          padding: '11px 16px',
          '&:hover': { background: '#1e293b' },
        },
        dividerRow: { margin: '16px 0' },
        dividerLine: { background: 'rgba(15, 23, 42, 0.08)' },
        dividerText: { fontFamily: '"Inter", sans-serif', fontSize: '12px', color: '#94a3b8', textTransform: 'uppercase', letterSpacing: '0.08em' },
        identityPreview: { fontFamily: '"Inter", sans-serif', fontSize: '13px' },
        formResendCodeLink: { color: '#1F6FBF' },
      },
    };

    window.addEventListener('load', async () => {
      await window.Clerk.load();
      window.Clerk.mountSignIn(document.getElementById('clerk-root'), {
        signUpUrl: '/signup',
        afterSignInUrl: '/account',
        appearance: CLERK_APPEARANCE,
      });
    });
  </script>
</body>
</html>
